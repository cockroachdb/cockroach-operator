replicaCount: 1

image:
  repository: cockroachdb/cockroach-operator
  tag: v2.18.3
  pullPolicy: IfNotPresent
  pullSecrets: []

namespace:
  create: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

watchNamespaces: []
logLevel: info
skipWebhookConfig: false

# Keep this map synchronized with crdb-versions.yaml when publishing images
# for disconnected environments. Keys are converted to RELATED_IMAGE_* names.
relatedImages: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits: {}

webhook:
  enabled: true
  failurePolicy: Fail
  service:
    port: 443
    targetPort: 9443

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}